quarkus.http.cors=true
#quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST
#quarkus.http.cors.headers=X-Custom
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

%dev.quarkus.datasource.db-kind = h2
%dev.quarkus.datasource.username = sa
%dev.quarkus.datasource.password =
%dev.quarkus.datasource.jdbc.url = jdbc:h2:file:./cabinetmed_db
# drop and create the database at startup (use `update` to only update the schema)
quarkus.hibernate-orm.database.generation=create

#%prod.quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.database.generation.halt-on-error=false
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true


%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost/cabinetmed
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://kds.albourina.io/issuer
quarkus.native.resources.includes=publicKey.pem

quarkus.log.min-level=TRACE
quarkus.log.category."io.quarkus.smallrye.jwt".level=TRACE

quarkus.log.category."io.quarkus.smallrye.jwt.runtime.auth.MpJwtValidator".min-level=TRACE

quarkus.container-image.build=true
quarkus.container-image.group=georgiods75
quakus.container-image.name=cabinetmed-backend

